name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (without the v prefix)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(jq -r .version plugins/enonic/.claude-plugin/plugin.json)" = "$VERSION"
          test "$(jq -r .version plugins/enonic/.codex-plugin/plugin.json)" = "$VERSION"
          test "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)" = "$VERSION"
          ! git rev-parse "v$VERSION" >/dev/null 2>&1
      - run: python -m pip install --requirement requirements-dev.txt
      - run: npm ci
      - name: Run all validation
        env:
          CLAUDE_BIN: ./node_modules/.bin/claude
          CODEX_BIN: ./node_modules/.bin/codex
          GEMINI_BIN: ./node_modules/.bin/gemini
        run: |
          bash scripts/validate.sh
          bash scripts/validate-codex.sh
          bash scripts/validate-copilot.sh
          bash scripts/validate-gemini.sh
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --generate-notes --title "v$VERSION"
