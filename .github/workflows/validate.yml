name: Validate

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  shared-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --requirement requirements-dev.txt
      - run: npm ci
      - name: Validate Agent Skills, Claude marketplace, and repository policies
        env:
          CLAUDE_BIN: ./node_modules/.bin/claude
        run: bash scripts/validate.sh
      - name: Install the plugin in an ephemeral Codex home
        env:
          CODEX_BIN: ./node_modules/.bin/codex
        run: bash scripts/validate-codex.sh
      - name: Install the skills for GitHub Copilot
        run: bash scripts/validate-copilot.sh
      - name: Install the skills in an ephemeral Gemini CLI home
        env:
          GEMINI_BIN: ./node_modules/.bin/gemini
        run: bash scripts/validate-gemini.sh
